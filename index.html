<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho / Menu -->
    <header>
        <div class="logo">🚀 MeuBlog</div>
        <nav>
            <ul>
                <li><a href="#" class="nav-link">Início</a></li>
                <li><a href="#" class="nav-link">Artigos</a></li>
                <li><a href="#" class="nav-link">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <!-- Post do Blog -->
        <article class="post-card">
            <div class="post-image"></div>
            <div class="post-content">
                <span class="category">Tecnologia</span>
                <h2>Como criar um blog ultra moderno e interativo</h2>
                <p>Animações fluidas e interatividade retêm mais leitores. Aprenda a usar CSS Grid, Flexbox e JavaScript para dar vida à sua página web.</p>
                <div class="post-meta">
                    <button class="like-btn" id="likeBtn">❤️ <span id="likeCount">0</span> Curtidas</button>
                    <span class="date">📅 26 de Agosto, 2026</span>
                </div>
            </div>
        </article>

        <!-- Seção de Comentários -->
        <section class="comments-section">
            <h3>Deixe seu Comentário</h3>
            <form id="commentForm">
                <input type="text" id="userName" placeholder="Seu nome" required>
                <textarea id="commentText" placeholder="O que você achou desse post?" rows="4" required></textarea>
                <button type="submit" class="submit-btn">Enviar Comentário</button>
            </form>

            <div class="comments-list" id="commentsList">
                <!-- Os comentários vão aparecer aqui dinamicamente -->
            </div>
        </section>
    </main>

    <script href="script.js"></script>
</body>
</html>
